[project]
name = "syncline"
version = "0.2.0"
description = "Describe a data sync in a YAML file instead of writing a script: messy customer files in, clean upserts out, with a dry-run diff and a readable rejected-rows report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MedAmine-SUDO" }]
requires-python = ">=3.12"
keywords = ["data sync", "etl", "csv", "data contracts", "upsert", "polars", "hr data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
]
dependencies = [
    "polars>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/MedAmine-SUDO/syncline"
Source = "https://github.com/MedAmine-SUDO/syncline"
Issues = "https://github.com/MedAmine-SUDO/syncline/issues"
Changelog = "https://github.com/MedAmine-SUDO/syncline/blob/main/CHANGELOG.md"

[project.scripts]
syncline = "syncline.cli:app"

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
excel = ["fastexcel>=0.11"]
postgres = ["psycopg[binary]>=3.1"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "xlsxwriter>=3.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src/syncline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["syncline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise ValueError\\(f\"unknown", "\\.\\.\\."]
